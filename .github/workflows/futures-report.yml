# 每個交易日收盤後自動產生台指期籌碼日報，並傳到 Telegram。
# 需要在 GitHub 專案的 Settings → Secrets and variables → Actions 設定：
#   TELEGRAM_BOT_TOKEN、TELEGRAM_CHAT_ID
name: 台指期籌碼日報

on:
  schedule:
    # 週一到週五 09:10 UTC ＝ 台灣時間 17:10（期交所資料大約 16:30 前公布完畢）
    - cron: "10 9 * * 1-5"
  workflow_dispatch:
    inputs:
      force:
        description: "今天沒有新資料也送出最近一天的日報（測試用）"
        type: boolean
        default: true

permissions:
  contents: write  # 把累積的歷史資料存回專案

concurrency:
  group: futures-report

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: futures-report
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: futures-report/requirements.txt

      - name: 安裝套件與中文字型
        run: |
          pip install -r requirements.txt
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk
          python -m playwright install --with-deps chromium

      - name: 產生日報並傳送
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m report auto ${{ inputs.force && '--force' || '' }}

      - name: 保存歷史資料
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f data/report.db 2>/dev/null || exit 0
          git diff --cached --quiet && exit 0
          git commit -m "futures-report: 更新資料 $(TZ=Asia/Taipei date +%F)"
          git push

      - name: 上傳日報檔案（可在執行紀錄頁面下載）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: report
          path: futures-report/output/
          if-no-files-found: ignore
